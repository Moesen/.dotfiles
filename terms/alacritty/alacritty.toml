[window]
padding = { x = 1, y = 2 }


[font]
normal = { family="AnonymicePro Nerd Font Mono", style="Normal" }
bold = { family="AnonymicePro Nerd Font Mono", style="Bold" }
italic = { family="AnonymicePro Nerd Font Mono", style="Italic" }
bold_italic = { family="AnonymicePro Nerd Font Mono", style="Bold Italic" }
size = 16

[cursor]
style = {shape="Block", blinking="On"}
vi_mode_style = {shape="Beam", blinking="On"}

[general]

live_config_reload = true
import = [
  "~/.config/alacritty/kanagawa-wave.toml",
]
